<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bg)"/>
  <rect width="900" height="520" rx="16" stroke="#2a2a4a" stroke-width="1" fill="none"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">How AutoShip Works</text>
  <text x="450" y="68" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Spec → Plan → Build → Verify → Deploy — all autonomous</text>

  <!-- Stage 1: Spec -->
  <g filter="shadow">
    <rect x="30" y="110" width="150" height="100" rx="12" fill="#1e1e36" stroke="#6366f1" stroke-width="1.5"/>
    <text x="105" y="140" text-anchor="middle" fill="#6366f1" font-family="system-ui, sans-serif" font-size="24">📝</text>
    <text x="105" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Your Spec</text>
    <text x="105" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">spec.md</text>
    <text x="105" y="200" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Plain English</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="180" y1="160" x2="220" y2="160" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/></marker></defs>

  <!-- Stage 2: Plan -->
  <g filter="shadow">
    <rect x="225" y="110" width="150" height="100" rx="12" fill="#1e1e36" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="140" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="24">🧠</text>
    <text x="300" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Plan</text>
    <text x="300" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">LLM infers stack,</text>
    <text x="300" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">caps, file list</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="375" y1="160" x2="415" y2="160" stroke="url(#orange)" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <defs><marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker></defs>

  <!-- Stage 3: Build -->
  <g filter="shadow">
    <rect x="420" y="110" width="150" height="100" rx="12" fill="#1e1e36" stroke="#10b981" stroke-width="1.5"/>
    <text x="495" y="140" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="24">🔨</text>
    <text x="495" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Build</text>
    <text x="495" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AI agent writes code,</text>
    <text x="495" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">installs deps, tests</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="570" y1="160" x2="610" y2="160" stroke="url(#green)" stroke-width="2" marker-end="url(#arrowhead3)"/>
  <defs><marker id="arrowhead3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34d399"/></marker></defs>

  <!-- Stage 4: Verify -->
  <g filter="shadow">
    <rect x="615" y="110" width="120" height="100" rx="12" fill="#1e1e36" stroke="#ec4899" stroke-width="1.5"/>
    <text x="675" y="140" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="24">✅</text>
    <text x="675" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Verify</text>
    <text x="675" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Check files,</text>
    <text x="675" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">retry if broken</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="735" y1="160" x2="755" y2="160" stroke="url(#pink)" stroke-width="2" marker-end="url(#arrowhead4)"/>
  <defs><marker id="arrowhead4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f472b6"/></marker></defs>

  <!-- Stage 5: Deploy -->
  <g filter="shadow">
    <rect x="760" y="110" width="110" height="100" rx="12" fill="#1e1e36" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="815" y="140" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="24">🚀</text>
    <text x="815" y="165" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Deploy</text>
    <text x="815" y="185" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Docker + SSL</text>
    <text x="815" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Live URL</text>
  </g>

  <!-- Retry loop arrow from Verify back to Build -->
  <path d="M 655 210 Q 655 245 575 245 Q 495 245 495 210" stroke="#ec4899" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrowhead5)"/>
  <defs><marker id="arrowhead5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ec4899"/></marker></defs>
  <text x="575" y="260" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="10" font-style="italic">retry up to 3×</text>

  <!-- Update Flow -->
  <g filter="shadow">
    <rect x="30" y="300" width="840" height="90" rx="12" fill="#1e1e36" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="60" y="335" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="24">🔄</text>
    <text x="90" y="335" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Iterative Updates</text>
    <text x="90" y="357" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Run again with a change request on the same output directory → agent reads existing code, applies only the diff, redeploys to the same URL.</text>
    <text x="90" y="377" fill="#64748b" font-family="monospace" font-size="11">python3 autoship.py changes.md -o myapp --deploy autoship</text>
  </g>

  <!-- Bottom stats -->
  <g>
    <rect x="30" y="420" width="170" height="70" rx="10" fill="#1e1e36" stroke="#2a2a4a" stroke-width="1"/>
    <text x="115" y="448" text-anchor="middle" fill="#6366f1" font-family="system-ui, sans-serif" font-size="13" font-weight="600">~830 lines</text>
    <text x="115" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Single Python file</text>
  </g>
  <g>
    <rect x="220" y="420" width="170" height="70" rx="10" fill="#1e1e36" stroke="#2a2a4a" stroke-width="1"/>
    <text x="305" y="448" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Zero Dependencies</text>
    <text x="305" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">stdlib only</text>
  </g>
  <g>
    <rect x="410" y="420" width="170" height="70" rx="10" fill="#1e1e36" stroke="#2a2a4a" stroke-width="1"/>
    <text x="495" y="448" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Self-Healing</text>
    <text x="495" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Auto-retry on failure</text>
  </g>
  <g>
    <rect x="600" y="420" width="170" height="70" rx="10" fill="#1e1e36" stroke="#2a2a4a" stroke-width="1"/>
    <text x="685" y="448" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Spec to Live URL</text>
    <text x="685" y="468" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">One command</text>
  </g>
</svg>
